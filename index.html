<style>
/* ===== 基础重置 ===== */
* { box-sizing: border-box; margin: 0; padding: 0; }
html { -webkit-text-size-adjust: 100%; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Segoe UI", sans-serif;
  color: #1a1a1a;
  background: #f4f4f4;
  line-height: 1.5;
}
button { font: inherit; color: inherit; }
ul { list-style: none; }

/* ===== 容器：手机全屏，桌面居中窄栏 ===== */
.app {
  max-width: 480px;
  min-height: 100vh;
  margin: 0 auto;
  background: #fff;
  padding: 22px 18px calc(24px + env(safe-area-inset-bottom));
  border-left: 1px solid #e8e8e8;
  border-right: 1px solid #e8e8e8;
}

/* ===== 日期区 ===== */
.date-bar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding-bottom: 14px;
  border-bottom: 1.5px solid #1a1a1a;
}
.nav-btn {
  width: 44px;
  height: 44px;
  border: 0;
  background: none;
  display: flex;
  align-items: center;
  justify-content: center;
}
.nav-btn:active { opacity: .35; }
.date-pick-btn {
  border: 0;
  background: none;
  text-align: center;
  padding: 6px 10px;
}
.date-main { display: block; font-size: 20px; font-weight: 600; letter-spacing: .5px; }
.date-week { display: block; font-size: 13px; color: #777; margin-top: 2px; }
.hidden-date { position: absolute; left: -9999px; top: 0; width: 1px; height: 1px; opacity: 0; }

/* ===== 板块小标题（每日任务用） ===== */
.daily-head {
  margin-top: 22px;
  display: flex;
  justify-content: space-between;
  align-items: baseline;
}
.section-title { font-size: 13px; font-weight: 700; letter-spacing: 2px; }

/* ===== 近期大任务板块（粗边框，醒目） ===== */
.span-section {
  margin-top: 20px;
  border: 1.5px solid #1a1a1a;
  padding: 12px 14px 14px;
}
.span-head {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  padding-bottom: 8px;
  border-bottom: 1px solid #1a1a1a;
  margin-bottom: 2px;
}
.span-title { font-size: 15px; font-weight: 700; letter-spacing: 2px; }
.span-count { font-size: 12px; color: #777; }
.span-head { cursor: pointer; }
.span-toggle {
  position: relative;
  flex: none;
  width: 30px;
  height: 30px;
  display: flex;
  align-items: center;
  justify-content: center;
}
.span-toggle::before { content: ""; position: absolute; inset: -6px; }
.span-toggle svg { transition: transform .18s ease; }
.span-section.collapsed .span-toggle svg { transform: rotate(180deg); }
.span-section.collapsed #spanList,
.span-section.collapsed #spanAdd { display: none; }
.span-row {
  display: flex;
  align-items: flex-start;
  gap: 10px;
  padding: 10px 0;
  border-bottom: 1px solid #ececec;
}
.span-row:last-of-type { border-bottom: 0; }
.square-check {
  position: relative;
  flex: none;
  width: 26px;
  height: 26px;
  margin-top: 3px;
  border: 1.5px solid #1a1a1a;
  border-radius: 0;
  background: none;
  padding: 0;
  display: flex;
  align-items: center;
  justify-content: center;
}
/* 伪元素把触控热区扩到 44px */
.square-check::before { content: ""; position: absolute; inset: -9px; }
.square-check svg { display: none; }
.span-row.done .square-check { background: #1a1a1a; }
.span-row.done .square-check svg { display: block; }
.span-main { flex: 1; min-width: 0; }
.span-input {
  width: 100%;
  border: 0;
  outline: 0;
  background: transparent;
  font-size: 16px;
  color: #1a1a1a;
  padding: 2px 0;
}
.span-row.done .span-input { color: #b0b0b0; text-decoration: line-through; }
.due-row { display: flex; align-items: center; gap: 6px; margin-top: 7px; }
.due-text {
  flex: 1;
  min-width: 0;
  border: 1px solid #1a1a1a;
  background: #fff;
  font-size: 12px;
  font-family: inherit;
  color: #1a1a1a;
  padding: 5px 7px;
}
.due-text.overdue { background: #1a1a1a; color: #fff; }
.due-cal {
  position: relative;
  flex: none;
  width: 32px;
  height: 32px;
  border: 1px solid #1a1a1a;
  background: #fff;
  display: flex;
  align-items: center;
  justify-content: center;
}
.due-cal::before { content: ""; position: absolute; inset: -6px; }
.due-cal:active { opacity: .6; }
.span-del {
  flex: none;
  width: 44px;
  height: 44px;
  border: 0;
  background: none;
  color: #999;
  font-size: 20px;
  margin-top: 2px;
}
.span-del:active { color: #1a1a1a; }
.span-add {
  width: 100%;
  margin-top: 12px;
  padding: 10px;
  background: #fff;
  border: 1px dashed #1a1a1a;
  font-size: 14px;
}
.span-add:active { background: #1a1a1a; color: #fff; }

/* ===== 12.13 执行计划 ===== */
.plan-card {
  margin-top: 20px;
  border: 1.5px solid #1a1a1a;
  padding: 14px;
  background: #fff;
}
.plan-card[hidden] { display: none; }
.plan-top {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 12px;
  padding-bottom: 10px;
  border-bottom: 1px solid #d9d9d9;
}
.plan-kicker {
  display: block;
  font-size: 11px;
  color: #777;
  letter-spacing: 1.4px;
  margin-bottom: 2px;
}
.plan-title { font-size: 18px; line-height: 1.35; font-weight: 700; }
.plan-phase {
  flex: none;
  max-width: 44%;
  border: 1px solid #1a1a1a;
  padding: 4px 7px;
  font-size: 11px;
  line-height: 1.35;
  text-align: right;
}
.plan-grid {
  display: grid;
  grid-template-columns: 5.2em minmax(0, 1fr);
  gap: 9px 10px;
  padding-top: 11px;
}
.plan-grid dt {
  color: #777;
  font-size: 12px;
  font-weight: 600;
}
.plan-grid dd {
  font-size: 14px;
  line-height: 1.5;
}
.plan-note {
  margin-top: 11px;
  padding-top: 10px;
  border-top: 1px dashed #bdbdbd;
  color: #555;
  font-size: 12px;
  line-height: 1.55;
}
.plan-note:empty { display: none; }
.plan-milestones {
  display: flex;
  flex-wrap: wrap;
  gap: 5px;
  margin-top: 12px;
}
.plan-milestones span {
  border: 1px solid #d0d0d0;
  padding: 3px 6px;
  font-size: 10px;
  color: #666;
}

/* ===== 每日任务进度小字 ===== */
.progress { font-size: 13px; color: #888; padding: 8px 0 2px; }
.progress:empty { display: none; }

/* ===== 每日任务行 ===== */
.task-row {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 0;
  border-bottom: 1px solid #ececec;
}
.check-btn {
  position: relative;
  flex: none;
  width: 30px;
  height: 30px;
  border: 1.5px solid #1a1a1a;
  border-radius: 50%;
  background: none;
  padding: 0;
  display: flex;
  align-items: center;
  justify-content: center;
}
/* 伪元素把触控热区扩到 44px */
.check-btn::before { content: ""; position: absolute; inset: -7px; }
.check-btn svg { display: none; }
.task-row.done .check-btn { background: #1a1a1a; }
.task-row.done .check-btn svg { display: block; }
.task-input {
  flex: 1;
  min-width: 0;
  border: 0;
  outline: 0;
  background: transparent;
  font-size: 16px;
  color: #1a1a1a;
  padding: 8px 0;
}
.task-row.done .task-input { color: #b0b0b0; text-decoration: line-through; }
.del-btn {
  flex: none;
  width: 44px;
  height: 44px;
  border: 0;
  background: none;
  color: #999;
  font-size: 20px;
}
.del-btn:active { color: #1a1a1a; }

/* ===== 每日任务添加按钮 ===== */
.add-btn {
  width: 100%;
  margin-top: 18px;
  padding: 13px;
  background: #fff;
  border: 1px solid #1a1a1a;
  font-size: 15px;
}
.add-btn:active { background: #1a1a1a; color: #fff; }

/* ===== 桌面端微调 ===== */
@media (min-width: 768px) {
  body { padding: 30px 0; }
  .app { min-height: calc(100vh - 60px); }
}
</style>
</head>
<body>
<main class="app">
  <!-- ===== 日期区 ===== -->
  <header class="date-bar">
    <button id="prevDay" class="nav-btn" aria-label="前一天">

  <aside id="planCard" class="plan-card" aria-labelledby="planTitle" hidden>

</main>

catch (e) { store = {}; }

var currentDate = keyOf(new Date());

function keyOf(d) {
  var m = String(d.getMonth() + 1).padStart(2, '0');
  var day = String(d.getDate()).padStart(2, '0');
  return d.getFullYear() + '-' + m + '-' + day;
}
function tasksOf(key) {
  if (!store[key]) store[key] = [];
  return store[key];
}
function spanTasks() {
  if (!store[SPAN_KEY]) store[SPAN_KEY] = [];
  return store[SPAN_KEY];
}
function save() { localStorage.setItem(STORE_KEY, JSON.stringify(store)); }
function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }
function dayDiff(aKey, bKey) {
  var a = new Date(aKey + 'T00:00:00');
  var b = new Date(bKey + 'T00:00:00');
  return Math.round((b - a) / 86400000);
}

  var d = new Date();
  d.setDate(d.getDate() + 7);

/* ===== 日期渲染 ===== */
function renderDate() {
  var parts = currentDate.split('-');
  var d = new Date(Number(parts[0]), Number(parts[1]) - 1, Number(parts[2]));
  dateMainEl.textContent = parts[0] + '年' + Number(parts[1]) + '月' + Number(parts[2]) + '日';
  dateWeekEl.textContent = '星期' + WEEK[d.getDay()];
  dateInputEl.value = currentDate;
}

/* ===== 每日任务渲染 ===== */
function rowHTML(t) {
  return '<li class="task-row' + (t.done ? ' done' : '') + '" data-row="' + t.id + '">'
    + '<button class="check-btn" data-id="' + t.id + '" aria-label="切换完成状态">'
    + '<svg viewBox="0 0 24 24" width="15" height="15"><path d="M5 12.5l4.5 4.5L19 7.5" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="butt" stroke-linejoin="miter"/></svg>'
    + '</button>'
    + '<input class="task-input" data-id="' + t.id + '" type="text" value="' + escapeAttr(t.text) + '" placeholder="任务内容">'
    + '<button class="del-btn" data-id="' + t.id + '" aria-label="删除此任务">×</button>'
    + '</li>';
}
function escapeAttr(s) {
  return String(s).replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}
function renderTasks(focusId) {
  var tasks = tasksOf(currentDate);
  listEl.innerHTML = tasks.map(rowHTML).join('');
  var doneCount = tasks.filter(function (t) { return t.done; }).length;
  progressEl.textContent = tasks.length ? ('已完成 ' + doneCount + ' / 共 ' + tasks.length + ' 条') : '';
  if (focusId) {
    var input = listEl.querySelector('input[data-id="' + focusId + '"]');
    if (input) input.focus();
  }
}

/* ===== 执行计划渲染 ===== */
var planCardEl = document.getElementById('planCard');
function renderPlan() {
  var plan = PLAN[currentDate];
  planCardEl.hidden = !plan;
  if (!plan) return;
  document.getElementById('planTitle').textContent = '今日执行安排';
  document.getElementById('planPhase').textContent = plan.phase;
  document.getElementById('planMain').textContent = plan.main;
  document.getElementById('planEnglish').textContent = plan.english;
  document.getElementById('planBody').textContent = plan.body;
  document.getElementById('planEvening').textContent = plan.evening;
  document.getElementById('planNote').textContent = plan.note || '';
}

/* ===== 大任务渲染 ===== */
function dueInfo(t) {
  var dp = t.due.split('-');
  var dateStr = Number(dp[1]) + '月' + Number(dp[2]) + '日';
  var diff = dayDiff(t.due, keyOf(new Date()));
  var text, overdue = false;
  if (diff === 0) text = dateStr + ' · 今天截止';
  else if (diff === 1) text = dateStr + ' · 明天截止';
  else if (diff > 1) text = dateStr + ' · 还剩' + diff + '天';
  else { text = dateStr + ' · 逾期' + (-diff) + '天'; overdue = true; }
  return { text: text, overdue: overdue && !t.done };
}
/* 手动写过就显示手写内容，否则用自动计算文案 */
function dueDisplay(t) {
  if (t.dueText) return { text: t.dueText, overdue: false };
  return dueInfo(t);
}
function spanRowHTML(t) {
  var info = dueDisplay(t);
  return '<li class="span-row' + (t.done ? ' done' : '') + '" data-srow="' + t.id + '">'
    + '<button class="square-check" data-sid="' + t.id + '" aria-label="切换完成状态">'
    + '<svg viewBox="0 0 24 24" width="14" height="14"><path d="M5 12.5l4.5 4.5L19 7.5" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="butt" stroke-linejoin="miter"/></svg>'
    + '</button>'
    + '<div class="span-main">'
    + '<input class="span-input" data-sid="' + t.id + '" type="text" value="' + escapeAttr(t.text) + '" placeholder="几天内要完成的大事">'
    + '<div class="due-row">'
    + '<input class="due-text' + (info.overdue ? ' overdue' : '') + '" data-sid="' + t.id + '" type="text" value="' + escapeAttr(info.text) + '" placeholder="可手写截止说明">'
    + '<button class="due-cal" data-sid="' + t.id + '" aria-label="选择截止日期">'
    + '<svg viewBox="0 0 24 24" width="15" height="15"><rect x="3.5" y="5" width="17" height="15" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M3.5 9h17M8 2.5v4M16 2.5v4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="square"/></svg>'
    + '</button>'
    + '<input type="date" class="hidden-date due-input" data-sid="' + t.id + '" value="' + t.due + '">'
    + '</div>'
    + '</div>'
    + '<button class="span-del" data-sid="' + t.id + '" aria-label="删除此任务">×</button>'
    + '</li>';
}
function renderSpan(focusId) {
  var tasks = spanTasks();
  spanListEl.innerHTML = tasks.map(spanRowHTML).join('');
  var active = tasks.filter(function (t) { return !t.done; }).length;
  spanCountEl.textContent = tasks.length ? (active + ' 项进行中') : '';
  if (focusId) {
    var input = spanListEl.querySelector('input.span-input[data-sid="' + focusId + '"]');
    if (input) input.focus();
  }
}

function renderAll() { renderDate(); renderPlan(); renderSpan(); renderTasks(); }

/* ===== 每日任务事件委托 ===== */
listEl.addEventListener('click', function (e) {
  var btn = e.target.closest('button');
  if (!btn) return;
  var id = btn.dataset.id;
  var tasks = tasksOf(currentDate);
  if (btn.classList.contains('check-btn')) {
    var target = tasks.find(function (t) { return t.id === id; });
    if (target) { target.done = !target.done; save(); renderTasks(); }
  } else if (btn.classList.contains('del-btn')) {
    store[currentDate] = tasks.filter(function (t) { return t.id !== id; });
    save(); renderTasks();
  }
});
listEl.addEventListener('input', function (e) {
  if (!e.target.classList.contains('task-input')) return;
  var target = tasksOf(currentDate).find(function (t) { return t.id === e.target.dataset.id; });
  if (target) { target.text = e.target.value; save(); }
});

/* ===== 大任务事件委托 ===== */
spanListEl.addEventListener('click', function (e) {
  var btn = e.target.closest('button');
  if (!btn) return;
  var id = btn.dataset.sid;
  var tasks = spanTasks();
  if (btn.classList.contains('square-check')) {
    var target = tasks.find(function (t) { return t.id === id; });
    if (target) { target.done = !target.done; save(); renderSpan(); }
  } else if (btn.classList.contains('span-del')) {
    store[SPAN_KEY] = tasks.filter(function (t) { return t.id !== id; });
    save(); renderSpan();
  } else if (btn.classList.contains('due-cal')) {
    var dueInput = spanListEl.querySelector('input.due-input[data-sid="' + id + '"]');
    if (dueInput) {
      try {
        if (typeof dueInput.showPicker === 'function') dueInput.showPicker();
        else dueInput.click();
      } catch (err) { dueInput.click(); }
    }
  }
});
spanListEl.addEventListener('input', function (e) {
  var target = spanTasks().find(function (t) { return t.id === e.target.dataset.sid; });
  if (!target) return;
  if (e.target.classList.contains('span-input')) { target.text = e.target.value; save(); }
  else if (e.target.classList.contains('due-text')) { target.dueText = e.target.value; save(); }
});
spanListEl.addEventListener('change', function (e) {
  if (!e.target.classList.contains('due-input')) return;
  var target = spanTasks().find(function (t) { return t.id === e.target.dataset.sid; });
  if (target && e.target.value) { target.due = e.target.value; target.dueText = ''; save(); renderSpan(); }
});

/* ===== 添加大任务（默认 7 天后截止） ===== */
document.getElementById('spanAdd').addEventListener('click', function () {
  var id = uid();
  spanTasks().push({ id: id, text: '', done: false, due: defaultDue() });
  save(); renderSpan(id);
});

/* ===== 添加每日任务 ===== */
document.getElementById('addBtn').addEventListener('click', function () {
  var id = uid();
  tasksOf(currentDate).push({ id: id, text: '', done: false });
  save(); renderTasks(id);
});

/* ===== 日期切换 ===== */
function shiftDate(delta) {
  var parts = currentDate.split('-');
  var d = new Date(Number(parts[0]), Number(parts[1]) - 1, Number(parts[2]) + delta);
  currentDate = keyOf(d);
  renderAll();
}
document.getElementById('prevDay').addEventListener('click', function () { shiftDate(-1); });
document.getElementById('nextDay').addEventListener('click', function () { shiftDate(1); });

document.getElementById('pickDate').addEventListener('click', function () {
  try {
    if (typeof dateInputEl.showPicker === 'function') dateInputEl.showPicker();
    else dateInputEl.click();
  } catch (e) { dateInputEl.click(); }
});
dateInputEl.addEventListener('change', function () {
  if (dateInputEl.value) { currentDate = dateInputEl.value; renderAll(); }
});

/* ===== 大任务折叠（偏好单独持久化） ===== */
var UI_KEY = 'daily-tasks-ui';
var uiPrefs;
try { uiPrefs = JSON.parse(localStorage.getItem(UI_KEY)) || {}; }
catch (e2) { uiPrefs = {}; }
var spanSectionEl = document.querySelector('.span-section');
function applyCollapsed() {
  var collapsed = !!uiPrefs.spanCollapsed;
  spanSectionEl.classList.toggle('collapsed', collapsed);
  document.getElementById('spanToggle').setAttribute('aria-expanded', String(!collapsed));
}
document.querySelector('.span-head').addEventListener('click', function () {
  uiPrefs.spanCollapsed = !uiPrefs.spanCollapsed;
  localStorage.setItem(UI_KEY, JSON.stringify(uiPrefs));
  applyCollapsed();
});

/* ===== 初始加载 ===== */
function seedPlan() {
  var seedKey = 'daily-tasks-plan-1213-seeded-v1';
  if (localStorage.getItem(seedKey)) return;

  Object.keys(PLAN).forEach(function (date) {
    var plan = PLAN[date];
    var tasks = tasksOf(date);
    var entries = [
      { id: 'plan-' + date + '-main', text: '主线｜' + plan.main },
      { id: 'plan-' + date + '-english', text: '四级｜' + plan.english },
      { id: 'plan-' + date + '-body', text: '身体｜' + plan.body }
    ];
    entries.forEach(function (entry) {
      if (!tasks.some(function (task) { return task.id === entry.id || task.text === entry.text; })) {
        tasks.push({ id: entry.id, text: entry.text, done: false, planned: true });
      }
    });
  });

  var milestones = [
    { id: 'plan-mile-400', text: '400 米比赛：争取 67—69 秒', due: '2026-11-20' },
    { id: 'plan-mile-mock2', text: '第二次四级模拟：低于 380 分则切换备考策略', due: '2026-11-28' },
    { id: 'plan-mile-pack', text: '完成简历、四案例作品集和可发送链接', due: '2026-12-05' },
    { id: 'plan-mile-cet', text: '四级考试：目标总分 425', due: '2026-12-12' },
    { id: 'plan-mile-work', text: '确认广州线下实习到岗与直属负责人', due: '2026-12-13' }
  ];
  var spans = spanTasks();
  milestones.forEach(function (item) {
    if (!spans.some(function (task) { return task.id === item.id || task.text === item.text; })) {
      spans.push({ id: item.id, text: item.text, done: false, due: item.due });
    }
  });

  save();
  localStorage.setItem(seedKey, '1');
}

seedPlan();
renderAll();
applyCollapsed();
